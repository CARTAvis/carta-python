name: Style check

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Install uv and set Python version
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
          enable-cache: true
      - name: Sync lint environment
        run: uv sync --locked --only-group lint
      - name: Lint with Ruff
        run: uv run --no-sync ruff check
